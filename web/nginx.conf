server {
  listen 80;
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate     /certs/fullchain.crt;
  ssl_certificate_key /certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location = /ca.crt {
    alias /certs/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition "attachment; filename=ca.crt";
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://vharvest:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ ^/workbox-.+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
